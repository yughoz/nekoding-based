<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Yughoz — AI Engineer | Nekoding</title>
  <meta name="description" content="Ikuti kucingnya: perjalanan scroll dari meja kecil Yughoz sampai pabrik robotik — AI Engineer di balik Nekoding." />
  <style>
    :root, .sw-root {
      --sw-bg: #F5EDE0;
      --sw-ink: #241d2b;
      --sw-ink-soft: #6a6072;
      --sw-accent: #C88A5A;
    }
  </style>
</head>
<body>
  <div id="top"></div>
  <div id="world"></div>

  <script src="scrub-engine.js"></script>
  <script>
    mountScrollWorld(document.getElementById('world'), {
      brand: { name: 'Nekoding', href: '#top' },
      cta: { label: 'GitHub', href: 'https://github.com/yughoz' },
      hint: 'scroll untuk ikuti kucingnya',
      diveScroll: 1.3,
      // Arch A walkthrough: no connectors — adjacent clips dissolve directly.
      // Widened from the 0.12 default to soften the park→site seam.
      crossfade: 0.55,
      sections: [
        {
          id: 'home', label: 'Home',
          still: 'assets/home.webp',
          clip: 'assets/vid/home.mp4',
          clipMobile: 'assets/vid/home-m.mp4',
          accent: '#C88A5A',
          linger: 0.4,
          eyebrow: "HELLO, I'M YUGHOZ",
          title: 'AI Engineer',
          body: 'Semua project besar dimulai dari meja kecil dengan cahaya hangat.',
          tags: ['AI Engineer', 'Nekoding', 'Maker'],
        },
        {
          id: 'park', label: 'Park',
          still: 'assets/park.webp',
          clip: 'assets/vid/park.mp4',
          clipMobile: 'assets/vid/park-m.mp4',
          accent: '#8FB98A',
          linger: 0.35,
          eyebrow: 'EKSPERIMEN',
          title: 'AI yang Mengubah Banyak Hal',
          body: 'Eksperimen-eksperimen kecil dengan AI — dari iseng jadi benar-benar berguna.',
          tags: ['AI Experiments', 'LLM', 'Automation'],
        },
        {
          id: 'site', label: 'Renovation',
          still: 'assets/site.webp',
          clip: 'assets/vid/site.mp4',
          clipMobile: 'assets/vid/site-m.mp4',
          accent: '#E9C46A',
          linger: 0.35,
          eyebrow: 'REFACTOR & REBUILD',
          title: 'Bongkar, Bangun Ulang',
          body: 'Aplikasi yang sudah ada bisa refactor dan rebuild dengan cepat dan jadi lebih baik.',
          tags: ['Refactor', 'Rebuild', 'Clean Code'],
        },
        {
          id: 'factory', label: 'Factory',
          still: 'assets/factory.webp',
          clip: 'assets/vid/factory.mp4',
          clipMobile: 'assets/vid/factory-m.mp4',
          accent: '#8a7bb5',
          eyebrow: 'HASIL KERJA',
          title: 'Ini yang Sudah Jadi',
          body: 'Dari pabrik nekoding lahir banyak web — tools online dan portfolio. Silakan dicoba.',
          tags: ['tools.nekoding.xyz', 'portfolio.nekoding.xyz'],
          cta: { primary: { label: 'Coba Tools', href: 'https://tools.nekoding.xyz' },
                 secondary: { label: 'Lihat Portfolio', href: 'https://portfolio.nekoding.xyz' } },
        },
      ],
      connectors: [],
    });
  </script>
</body>
</html>
